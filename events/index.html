<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Upcoming expos, seminars, webinars, and community events for GTU students — curated by GTUPEDIA.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://gtupedia.github.io/events/">
    <meta property="og:site_name" content="GTUPEDIA">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Upcoming Events — GTUPEDIA">
    <meta property="og:description" content="Discover expos, seminars, webinars, and community events — starting with Prawaas 5.0 in Gandhinagar.">
    <meta property="og:url" content="https://gtupedia.github.io/events/">
    <title>Upcoming Events — GTUPEDIA</title>
    <script>
      window.__GTUPEDIA_BASE = location.pathname.startsWith('/gtupedia.github.io') ? '/gtupedia.github.io/' : '/';
    </script>
    <base href="../">
    <script>document.querySelector('base').href = window.__GTUPEDIA_BASE;</script>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body class="subpage events-page">
    <header class="site-header">
      <div class="brand-group">
        <a class="brand" href="./" aria-label="GTUPEDIA home">GTU<span>PEDIA</span></a>
        <span class="beta-badge">Beta</span>
      </div>
      <nav aria-label="Primary navigation">
        <a href="resources/">Resources</a>
        <a href="team/">Team</a>
        <a href="./#about">About</a>
      </nav>
    </header>

    <main>
      <section class="page-shell events-hero">
        <p class="eyebrow">Beyond the syllabus</p>
        <h1 class="page-title">Upcoming events</h1>
        <p id="events-intro" class="seo-intro">Loading…</p>
      </section>

      <section class="page-shell" aria-labelledby="events-list-title">
        <h2 id="events-list-title" class="visually-hidden">Listed events</h2>
        <div id="events-list" class="events-list">
          <p class="page-loading">Loading events…</p>
        </div>
      </section>

      <section class="page-shell events-note">
        <h2>Suggest an event</h2>
        <p>Know an expo, seminar, or student meetup we should list? Share it with <a href="team/">Team GTUPEDIA</a> or a <a href="campus-ambassador/">Campus Ambassador</a> at your college.</p>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>

    <script src="assets/site-footer.js"></script>
    <script src="assets/events.js"></script>
  </body>
</html>
