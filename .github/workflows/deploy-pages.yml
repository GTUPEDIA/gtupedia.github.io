name: Build site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build catalog, sitemap, and SEO pages
        run: node scripts/build-catalog.js

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtupedia-hostinger
          path: |
            .
            !.git
          retention-days: 14

      - name: Deploy note
        run: |
          echo "Site is hosted on Hostinger (gtupedia.com)."
          echo "Download the artifact and upload to public_html, or use FTP/Git on Hostinger."
